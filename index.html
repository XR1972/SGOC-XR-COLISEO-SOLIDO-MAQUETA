<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SGOC XR - MAQUETA 20 DE JULIO</title>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");

const engine = new BABYLON.Engine(canvas, true);

const createScene = async function () {

    const scene = new BABYLON.Scene(engine);
    scene.collisionsEnabled = true;
    scene.gravity = new BABYLON.Vector3(0, -0.5, 0);

   // ===== CAMARA PARA MAQUETA =====
const camera = new BABYLON.ArcRotateCamera(
    "cameraMaqueta",
    BABYLON.Tools.ToRadians(45),
    BABYLON.Tools.ToRadians(65),
    2.20,
    new BABYLON.Vector3(0, 0.95, 0),
    scene
);

camera.attachControl(canvas, true);

// Limites de zoom
camera.lowerRadiusLimit = 0.70;
camera.upperRadiusLimit = 4.00;

// Limites verticales para no voltear la camara
camera.lowerBetaLimit = BABYLON.Tools.ToRadians(20);
camera.upperBetaLimit = BABYLON.Tools.ToRadians(85);

// Suavidad de movimiento
camera.wheelPrecision = 50;
camera.panningSensibility = 1000;

    // Luz
    const light = new BABYLON.HemisphericLight(
        "light",
        new BABYLON.Vector3(0, 1, 0),
        scene
    );

    light.intensity = 1.2;

    // Cargar edificio
    const result = await BABYLON.SceneLoader.ImportMeshAsync(
        "",
        "./",
        "COLISEO SOLIDO_SGOC_MASTER.HD.glb",
        scene
    );

    console.log("MODELO SGOC CARGADO", result);
    result.meshes.forEach(mesh => {
    mesh.checkCollisions = true;
    });


    // Encuadrar automaticamente el modelo cargado
const meshes = result.meshes.filter(m => m.getTotalVertices && m.getTotalVertices() > 0);
const bounds = BABYLON.Mesh.MinMax(meshes);
const center = BABYLON.Vector3.Center(bounds.min, bounds.max);
const size = bounds.max.subtract(bounds.min);
const maxSize = Math.max(size.x, size.y, size.z);

    // ===== MODO MAQUETA: reducir modelo a 80 cm =====
const tamanoMaqueta = 0.80;
const escalaMaqueta = tamanoMaqueta / maxSize;

const maquetaRoot = new BABYLON.TransformNode("maquetaRoot", scene);

result.meshes
    .filter(mesh => !mesh.parent)
    .forEach(mesh => {
        mesh.parent = maquetaRoot;
    });

maquetaRoot.scaling = new BABYLON.Vector3(
    escalaMaqueta,
    escalaMaqueta,
    escalaMaqueta
);

    // ===== POSICIONAR MAQUETA SOBRE MESA =====
const alturaMesa = 1.2;

// ===== PIVOTE CENTRAL FIJO DE LA MAQUETA =====
const giroRoot = new BABYLON.TransformNode("giroRoot", scene);

// El pivote queda exactamente en el centro de la mesa
giroRoot.position = new BABYLON.Vector3(
    0,
    alturaMesa,
    0
);

// El edificio pasa a depender del pivote
maquetaRoot.parent = giroRoot;

// Posición LOCAL respecto al pivote
maquetaRoot.position = new BABYLON.Vector3(
    -center.x * escalaMaqueta,
    -bounds.min.y * escalaMaqueta,
    -center.z * escalaMaqueta
);
// Mesa virtual
const mesa = BABYLON.MeshBuilder.CreateBox(
    "mesaMaqueta",
    {
        width: 1.20,
        depth: 1.20,
        height: 0.05
    },
    scene
);

mesa.position = new BABYLON.Vector3(
    0,
    alturaMesa - 0.025,
    0
);

console.log("CENTRO MODELO:", center);
console.log("TAMANO MODELO:", size);

    // Activar WebXR
    try {

const xr = await scene.createDefaultXRExperienceAsync({
    floorMeshes: [],
    disableTeleportation: true
});




        
  // ===== GIRO XR DE LA MAQUETA SOBRE SU EJE =====
let giroJoystickX = 0;

xr.input.onControllerAddedObservable.add((xrController) => {

    if (xrController.inputSource.handedness !== "right") return;

    xrController.onMotionControllerInitObservable.add((motionController) => {

        const joystick = motionController.getComponent("xr-standard-thumbstick");

        if (!joystick) return;

        joystick.onAxisValueChangedObservable.add((axes) => {
            giroJoystickX = axes.x;
        });
    });
});

scene.onBeforeRenderObservable.add(() => {

    if (Math.abs(giroJoystickX) > 0.15) {
        giroRoot.rotation.y += giroJoystickX * 0.025;
    }

});    
        console.log("SGOC XR ACTIVO");

    } catch (error) {

        console.log("WebXR no disponible en este dispositivo", error);

    }

    return scene;
};

createScene().then(scene => {

    engine.runRenderLoop(function () {
        scene.render();
    });

});

window.addEventListener("resize", function () {
    engine.resize();
});
</script>

</body>
</html>
